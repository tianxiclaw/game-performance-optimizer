name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v6.0.0'
        required: true
        default: 'v6.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows PowerShell 5.1 会按系统 ANSI 代码页读取无 BOM 的 .ps1；
      # 中文脚本缺少 BOM 时，在 GBK/1252 系统上会把引擎文件名读成乱码。
      - name: Verify script encoding
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Path . -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '[\\/](obj|bin|dist|发布)[\\/]' } |
            ForEach-Object {
              $bytes = [IO.File]::ReadAllBytes($_.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              if (-not $hasBom) { $bad += $_.FullName }
            }
          if ($bad.Count -gt 0) { throw ('以下脚本缺少 UTF-8 BOM: ' + ($bad -join '; ')) }
          Write-Output '脚本编码检查通过'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = $tag -replace '^v', ''
          $name = "游戏性能优化中心_v$version"
          $stage = Join-Path $env:RUNNER_TEMP $name
          $publish = Join-Path $env:RUNNER_TEMP 'publish'

          dotnet publish src/GamePerfCenter/GamePerfCenter.csproj `
            -c Release -p:Platform=x64 -r win-x64 --self-contained true `
            -p:PublishReadyToRun=false -o $publish -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败" }

          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path (Join-Path $publish '*') -Destination $stage -Recurse -Force
          Get-ChildItem -LiteralPath $stage -Filter *.pdb -Recurse | Remove-Item -Force

          $fallback = Join-Path $stage '备用-WinForms'
          New-Item -ItemType Directory -Path $fallback -Force | Out-Null
          $files = @(
            '游戏性能优化-GUI.ps1',
            '游戏性能优化.ps1',
            '启动优化脚本.bat',
            '启动控制台版.bat',
            '赞赏码.png',
            '使用说明.txt'
          )
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f)) { throw "缺少文件: $f" }
            Copy-Item -LiteralPath $f -Destination $fallback -Force
          }

          $root = (Get-Item -LiteralPath $stage).FullName
          $lines = foreach ($f in (Get-ChildItem -LiteralPath $stage -File -Recurse | Sort-Object FullName)) {
            $rel = $f.FullName.Substring($root.Length + 1)
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash, $rel
          }
          Set-Content -LiteralPath (Join-Path $stage 'SHA256.txt') -Value $lines -Encoding utf8NoBOM

          $zip = Join-Path $env:RUNNER_TEMP "game-performance-optimizer_v${version}_portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal

          "PKG=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $title = "$env:TAG 便携版"
          gh release create $env:TAG $env:PKG --title $title --notes-file .github/release-notes.md

      - name: Set Chinese asset label
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = gh api "repos/${{ github.repository }}/releases/tags/$env:TAG" --jq '.assets[0].id'
          $json = @{ label = "游戏性能优化中心_v$($env:VERSION)_便携版.zip" } | ConvertTo-Json -Compress
          $file = Join-Path $env:RUNNER_TEMP 'asset-label.json'
          [IO.File]::WriteAllText($file, $json, (New-Object System.Text.UTF8Encoding($false)))
          gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$asset" --input $file
