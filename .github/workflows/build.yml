name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows PowerShell 5.1 会按系统 ANSI 代码页读取无 BOM 的 .ps1；
      # 中文脚本缺少 BOM 时，在 GBK/1252 系统上会把引擎文件名读成乱码。
      - name: Verify script encoding
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Path . -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '[\\/](obj|bin|dist|发布)[\\/]' } |
            ForEach-Object {
              $bytes = [IO.File]::ReadAllBytes($_.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              if (-not $hasBom) { $bad += $_.FullName }
            }
          if ($bad.Count -gt 0) { throw ('以下脚本缺少 UTF-8 BOM: ' + ($bad -join '; ')) }
          Write-Output '脚本编码检查通过'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 构建整个解决方案：WinUI / Core / CLI / Tests 任一项目编译失败都要在 PR 阶段暴露。
      - name: Build solution
        shell: pwsh
        run: |
          dotnet build GamePerfCenter.sln -c Release -p:Platform=x64 -v:minimal
          if ($LASTEXITCODE -ne 0) { throw '解决方案构建失败' }

      - name: Run functional tests
        shell: pwsh
        run: |
          dotnet run --project src/GamePerfCenter.Tests/GamePerfCenter.Tests.csproj -c Release -v:minimal
          if ($LASTEXITCODE -ne 0) { throw '功能测试失败' }

      # 语言审计需要真实桌面会话，GitHub 托管的 Windows runner 无法稳定创建窗口，
      # 因此只在本地执行：GamePerfCenter.exe --lang-audit。